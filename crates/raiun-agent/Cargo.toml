[package]
name = "raiun-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
raiun-core = { path = "../raiun-core" }
raiun-opencloud = { path = "../raiun-opencloud" }
raiun-engine = { path = "../raiun-engine" }
raiun-fuse = { path = "../raiun-fuse" }
