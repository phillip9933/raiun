import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Resolve only declared external artifact files. The task intentionally has no
// compile/build dependency, so it cannot replace the already compiled inputs.
if (gradle.startParameter.projectProperties['raiun.r8Validation'] != 'true') {
    throw new GradleException('Run with -Praiun.r8Validation=true so the validation test configurations exist.')
}

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('traceClassfileInventory') {
        group = 'verification'
        description = 'Writes resolved external artifacts for compiled R8 ABI inventory.'
        doLast {
            def result = [:]
            ['releaseRuntimeClasspath', 'r8ValidationRuntimeClasspath',
             'r8ValidationAndroidTestRuntimeClasspath',
             'r8ValidationAndroidTestCompileClasspath'].each { name ->
                def configuration = app.configurations.getByName(name)
                def artifacts = configuration.incoming.artifactView {
                    componentFilter { it instanceof ModuleComponentIdentifier }
                }.artifacts.artifacts
                result[name] = artifacts.collect { artifact ->
                    def id = artifact.id.componentIdentifier
                    [component: "${id.group}:${id.module}:${id.version}",
                     path: artifact.file.absolutePath]
                }.sort { a, b -> a.component <=> b.component ?: a.path <=> b.path }
            }
            def destinationPath = gradle.startParameter.projectProperties['raiun.inventoryOutput']
            if (!destinationPath) throw new GradleException('Set -Praiun.inventoryOutput=<absolute path>')
            def destination = new File(destinationPath)
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\n'
            println("Wrote resolved classfile inventory to ${destination}; counts=" +
                    result.collectEntries { k, v -> [k, v.size()] })
        }
    }
}
