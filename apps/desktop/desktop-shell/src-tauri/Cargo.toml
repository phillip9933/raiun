[package]
name = "raiun-desktop-shell"
version = "0.7.0-beta.2"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raiun-core = { path = "../../crates/raiun-core" }
raiun-control = { path = "../../crates/raiun-control" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.14.0"
tempfile = "=3.27.0"
url = "2"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
raiun-control-windows = { path = "../../crates/raiun-control-windows" }
tauri-plugin-dialog = { version = "2", default-features = false }
