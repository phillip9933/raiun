[package]
name = "raiun-control-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Fixed-stage filesystem diagnostics are available only to synthetic test
# builds that explicitly opt in through the Cloud Files test feature.
synthetic-agent-integration = []

[dependencies]
raiun-control = { path = "../raiun-control" }
serde_json.workspace = true
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
fs2 = "0.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# This is an isolated Win32 adapter. Keep unsafe code confined to native
# adapter modules; the portable control/framing crate remains unsafe-free.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
