[package]
name = "raiun-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only trust root for the isolated native synthetic-auth fixture. This is
# never enabled by a production package and has no insecure-TLS mode.
synthetic-test-ca = ["raiun-opencloud/synthetic-test-ca"]

[dependencies]
raiun-control = { path = "../raiun-control" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
getrandom = "0.4"
url = "2"
base64 = "0.22"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
raiun-vault = { path = "../raiun-vault" }
raiun-core = { path = "../raiun-core" }
raiun-opencloud = { path = "../raiun-opencloud" }
raiun-engine = { path = "../raiun-engine" }
raiun-fuse = { path = "../raiun-fuse" }
raiun-cache = { path = "../raiun-cache" }
tempfile.workspace = true
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
raiun-cache = { path = "../raiun-cache" }
raiun-core = { path = "../raiun-core" }
raiun-opencloud = { path = "../raiun-opencloud" }
raiun-control-windows = { path = "../raiun-control-windows" }
raiun-cloudfiles-windows = { path = "../raiun-cloudfiles-windows" }

[target.'cfg(windows)'.dev-dependencies]
raiun-cloudfiles-windows = { path = "../raiun-cloudfiles-windows", features = ["synthetic-agent-integration"] }

[lints]
workspace = true
