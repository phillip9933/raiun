[package]
name = "raiun-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
raiun-core = { path = "../raiun-core" }
raiun-cache = { path = "../raiun-cache" }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile.workspace = true
url = "2"

[target.'cfg(windows)'.dependencies]
raiun-control-windows = { path = "../raiun-control-windows" }
raiun-sqlite-windows = { path = "../raiun-sqlite-windows", features = ["trusted-engine-integration"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
