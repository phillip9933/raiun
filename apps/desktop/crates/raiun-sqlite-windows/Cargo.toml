[package]
name = "raiun-sqlite-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Internal workspace integration only; callers are trusted to retain SQL policy.
trusted-cache-integration = []
# Internal engine bridge; fixed engine filename, same rollback-only policy.
trusted-engine-integration = []

[dependencies]

[target.'cfg(windows)'.dependencies]
raiun-control-windows = { path = "../raiun-control-windows" }
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
