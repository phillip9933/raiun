[package]
name = "raiun-desktop-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
url = "2"

[lints.rust]
unsafe_code = "forbid"
