[package]
name = "raiun-desktop-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raiun-core = { path = "../../crates/raiun-core" }
raiun-control = { path = "../../crates/raiun-control" }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
raiun-control-windows = { path = "../../crates/raiun-control-windows" }
tauri-plugin-dialog = { version = "2", default-features = false }
