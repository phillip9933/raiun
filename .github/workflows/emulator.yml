name: Android emulator tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  instrumentation:
    name: Android API ${{ matrix.api }} instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned offline scanner SDK
        run: python scripts/install_offline_scanner_sdk.py

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew
            :app:connectedDebugAndroidTest
            :core:crypto:connectedDebugAndroidTest
            :core:security:connectedDebugAndroidTest
            :core:sync:connectedDebugAndroidTest
            :core:database:connectedDebugAndroidTest
            :core:documentsprovider:connectedDebugAndroidTest
            :core:ui:connectedDebugAndroidTest
            :feature:files:connectedDebugAndroidTest
            --no-daemon

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-instrumentation-reports-api-${{ matrix.api }}
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
