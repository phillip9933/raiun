name: Android quality and visual regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/android

jobs:
  verify:
    name: Lint, tests, goldens, and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned offline scanner SDK
        run: python scripts/install_offline_scanner_sdk.py

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6

      - name: Test optional translation validation
        run: python scripts/test_locale_validator.py

      - name: Validate translations and format tokens (English fallback allowed)
        run: |
          for locale in de fr es pt-rPT ja; do
            pwsh -NoProfile -File scripts/validate-locale-resources.ps1 -Locale "$locale"
          done

      - name: Verify formatting
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run static analysis
        run: ./gradlew detekt --no-daemon

      - name: Run all unit tests and verify Compose goldens
        run: ./gradlew testDebugUnitTest :app:verifyRoborazziDebug --no-daemon --stacktrace

      - name: Lint release
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      # APK compression needs more heap for the scanner's native libraries.
      # Package variants in separate Gradle processes to bound peak memory.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'

      - name: Test native dependency inventory checks
        run: python3 scripts/test_check_native_dependencies.py

      - name: Verify packaged native libraries against pinned artifacts
        run: >-
          python3 scripts/check_native_dependencies.py
          --inventory docs/release-audit/native/inventory.json
          --pins gradle/runtime-artifact-pins.sha256
          --apk app/build/outputs/apk/release/app-release-unsigned.apk
          --artifact-root "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"
          --artifact-root .gradle/open-android-doc-scanner-0.8.0-beta.1/maven
          --artifact-root third_party/native-security-fixes/maven
          --output build/native-integrity-results.json

      - name: Report runner disk capacity on failure
        if: failure()
        run: df -h

      - name: Upload reports and visual diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-quality-reports-and-visual-diffs
          if-no-files-found: ignore
          path: |
            apps/android/**/build/reports/**
            apps/android/**/build/outputs/roborazzi/**
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/mapping/release/**
            apps/android/build/native-integrity-results.json
