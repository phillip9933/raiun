name: Android Play bundle checks

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-play-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/android

jobs:
  unsigned-play-bundle:
    name: Check unsigned Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6

      - name: Install scanner and Android build packages
        run: |
          python3 scripts/install_offline_scanner_sdk.py
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check Play source and regression tests
        run: >-
          ./gradlew -Praiun.playBuild=true ktlintCheck :app:testDebugUnitTest
          --tests '*FileExportTest' --tests '*PlayPrivacyPolicyTest'
          --no-daemon --max-workers=2

      - name: Build the unsigned Play bundle
        run: >-
          ./gradlew -Praiun.playBuild=true :app:bundleRelease
          --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'

      - name: Check the verifier and the exact bundle
        run: |
          python3 scripts/test_check_play_bundle.py
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar \
            --output "$RUNNER_TEMP/bundletool-1.18.2.jar"
          printf '%s  %s\n' "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584" \
            "$RUNNER_TEMP/bundletool-1.18.2.jar" | sha256sum --check -
          python3 scripts/check_play_bundle.py \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool-1.18.2.jar"
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Retain unsigned verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raiun-play-unsigned-verification-only
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
