name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p raiun-core -p raiun-cli -p raiun-opencloud -p raiun-engine
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libfuse3-dev libsecret-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: scripts/build-linux.sh
      - run: cargo fmt --manifest-path desktop-shell/src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path desktop-shell/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path desktop-shell/src-tauri/Cargo.toml --locked
