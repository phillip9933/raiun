name: Desktop checks
on:
  push:
    paths:
      - '.gitattributes'
      - 'apps/desktop/**'
      - 'design/raiun/**'
      - '.github/workflows/desktop-*.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'apps/desktop/**'
      - 'design/raiun/**'
      - '.github/workflows/desktop-*.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/desktop
jobs:
  portable-core:
    name: Desktop portable core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked -p raiun-core -p raiun-cli -p raiun-opencloud -p raiun-engine
  linux:
    name: Desktop Linux checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libfuse3-dev libsecret-tools zenity
      - name: Check shared Raiun design tokens
        run: python3 scripts/design-tokens.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: scripts/build-linux.sh
      - run: node --test desktop-shell/tests/*.test.mjs
      - run: cargo fmt --manifest-path desktop-shell/src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path desktop-shell/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path desktop-shell/src-tauri/Cargo.toml --locked
      - name: Upload Linux beta package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raiun-desktop-linux-x86_64
          path: apps/desktop/target/raiun-desktop-linux-x86_64.tar.gz
          if-no-files-found: error
