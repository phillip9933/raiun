name: Android dependency advisories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  pull_request:
    paths:
      - .github/workflows/android-dependencies.yml
      - apps/android/gradle/runtime-artifact-pins.sha256
      - apps/android/scripts/check_runtime_advisories.py
      - apps/android/scripts/test_check_runtime_advisories.py
      - apps/android/scripts/check_native_dependencies.py
      - apps/android/scripts/test_check_native_dependencies.py
      - apps/android/docs/release-audit/native/**
      - apps/android/docs/NATIVE-DEPENDENCIES.md
      - apps/android/third_party/native-security-fixes/**

permissions:
  contents: read

jobs:
  osv-runtime:
    name: Check pinned Android runtime Maven advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test advisory checker
        run: python3 apps/android/scripts/test_check_runtime_advisories.py

      - name: Query OSV for pinned runtime artifacts
        run: >-
          python3 apps/android/scripts/check_runtime_advisories.py
          --pins apps/android/gradle/runtime-artifact-pins.sha256
          --output apps/android/build/runtime-advisory-results.json

      - name: Upload advisory results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-runtime-advisories
          if-no-files-found: ignore
          path: apps/android/build/runtime-advisory-results.json

  native-source-advisories:
    name: Review pinned Android native source advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test native checker
        run: python3 apps/android/scripts/test_check_native_dependencies.py

      - name: Query pinned native source identities and retain review findings
        run: >-
          python3 apps/android/scripts/check_native_dependencies.py
          --inventory apps/android/docs/release-audit/native/inventory.json
          --pins apps/android/gradle/runtime-artifact-pins.sha256
          --scan --output apps/android/build/native-advisory-results.json

      - name: Upload native advisory results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-advisories
          if-no-files-found: error
          path: apps/android/build/native-advisory-results.json
