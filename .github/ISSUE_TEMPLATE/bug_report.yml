name: Bug report
description: Report a reproducible problem in a Raiun app.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens or private files. Use private vulnerability reporting for security issues."
  - type: dropdown
    id: platform
    attributes:
      label: App platform
      options:
        - Android
        - Desktop
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, device and OpenCloud server versions
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or additional context
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: What is affected, and what is outside this report?
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Observable acceptance criteria; maintainers may refine these during triage.
      placeholder: "- [ ] The reported behavior is corrected without losing existing data."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues or prerequisites; write None if unknown.
