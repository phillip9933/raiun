name: Bug report
description: Report a reproducible problem in a Raiun app.
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens or private files. Use private vulnerability reporting for security issues."
  - type: dropdown
    id: platform
    attributes:
      label: App platform
      options:
        - Android
        - Desktop
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, device and OpenCloud server versions
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or additional context
